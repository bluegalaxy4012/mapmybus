name: mapmybus
description: "Urmareste transportul public in timp real."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  latlong2: ^0.9.1
  flutter_map: ^8.2.1
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  http: ^1.5.0-beta.2
  csv: ^6.0.0
  logger: ^2.6.1
  flutter_screenutil: ^5.9.3
  diacritic: ^0.1.6 
  retry: ^3.1.2
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-Italic.ttf
          style: italic

  assets:
    - assets/map_my_bus.png
    - assets/map_my_bus_tutorial.png
