name: mapmybus
description: "Urmareste transportul public in timp real."
publish_to: 'none'
version: 2.0.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  latlong2: ^0.10.1
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.9.0
  shared_preferences: ^2.5.5
  geolocator: ^14.1.1
  http: ^1.5.0-beta.2
  csv: ^8.0.0
  logger: ^2.8.0
  flutter_screenutil: ^5.9.3
  diacritic: ^0.1.6 
  retry: ^3.1.2
  smooth_page_indicator: ^3.0.0
  permission_handler: 13.0.2
  url_launcher: ^6.3.3
  universal_web: ^1.1.1+1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-Italic.ttf
          style: italic

  assets:
    - assets/map_my_bus.png
    - assets/map_my_bus_tutorial.png
